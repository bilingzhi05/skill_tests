# 工作区声明文件
# 作用：让 skill-review 成为独立的工作区根，
#       不被上一级目录的 pnpm 工作区吞并（否则 pnpm install 不生效）。

# 缓存与全局存储放在本项目目录内（pnpm 11 不再读取 .npmrc，
# 必须写在这里；否则默认写系统 AppData 目录，当前环境无权限会安装失败）
cacheDir: .pnpm-cache
storeDir: .pnpm-store

# 使用扁平化（hoisted）node_modules 布局，避免默认符号链接布局
# 在当前文件系统上链接卡死的问题
nodeLinker: hoisted

# 从全局存储导入到 node_modules 时使用「复制」而非硬链接，
# 规避当前文件系统对硬链接的限制
packageImportMethod: copy

# 关闭「运行脚本前自动检查依赖」：避免 build/dev 前触发额外联网安装
verifyDepsBeforeRun: false

# sharp 是 Next.js 的可选图片优化组件（本项目已关闭图片优化，不需要它），
# 显式禁止其安装脚本，避免安装时下载原生二进制失败
allowBuilds:
  sharp: false
