# ============================================================
# Skill 任务定义（由 FastAPI 服务 + 人工共同维护）
# 字段:
#   id         : 系统生成的唯一 ID（请勿手工修改）
#   name       : 任务名称
#   owner      : 创建者登录名
#   enabled    : 是否启用（false 则不触发；一次性任务执行后自动置 false）
#   trigger    : cron（周期）| once（指定时间一次）
#   cron       : 5 段 cron 表达式（trigger=cron 时生效）
#   run_at     : 一次性执行时间 'YYYY-MM-DD HH:MM'（trigger=once 时生效）
#   skill      : skill 名称（传给 --skill）
#   jql        : JQL 查询语句
#   email      : 收件人邮箱（逗号分隔，结果会复制到 user_data/<用户名>/）
#   max_issues : 最多送 AI 分析条数（0=不限）
#   created_t  : 创建时间
# 注意：本服务运行时请停用原 crontab 中的 run_skills_scheduler.py，
#       避免 cron 任务被双重触发。
# ============================================================
