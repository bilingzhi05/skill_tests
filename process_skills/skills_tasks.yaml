# ============================================================
# run_skills_scheduler.py 任务配置
# 每个任务对应一次 run_jql_with_skill_demo.py 的调用
#
# 字段说明:
#   name       : 任务名称（用于输出/日志文件命名，如 Nagracas / vmxcas）
#   cron       : 标准 5 段 cron 表达式（分 时 日 月 周）
#   skill      : 分析所使用的技能名称（传给 --skill；留空则不在 prompt 中指定技能）
#   jql        : JQL 查询语句
#   email      : 收件人邮箱（逗号分隔；结果会复制到 user_data/<用户名小写>/ 下）
#   max_issues : 最多送 AI 分析的条数（0=不限制）
# ============================================================
tasks:
  - name: over_60round_BT
    cron: "48 14 * * *"
    skill: "analyze_bt_log"
    jql: |-
      key in (OTT-84222,TV-252209,TV-252366,TV-252686,TV-252094,TV-243794,OTT-100792)
    email: "lingzhi.bi@amlogic.com"
    max_issues: 1
